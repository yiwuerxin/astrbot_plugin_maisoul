name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 单元测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      # 检出到子目录 astrbot_plugin_maisoul/：test_core.py 把 tests/../.. 加进
      # sys.path 后以包名导入 core，工作区根必须正好是插件目录的父目录
      - uses: actions/checkout@v4
        with:
          path: astrbot_plugin_maisoul
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: pip install -r astrbot_plugin_maisoul/requirements.txt pytest
      - name: 运行测试
        # pytest 套件（21 个 test_* 用例，覆盖自执行的 369 项 check）：
        # check() 在 pytest 环境下失败即抛 AssertionError；本地手跑仍可用
        # python3 tests/test_core.py 走聚合计数模式，两入口共用同一套用例
        run: python -m pytest astrbot_plugin_maisoul/tests/ -q

  purity:
    name: 纯净交付检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行时数据与本地私有文件不得被跟踪
        run: |
          if git ls-files | grep -E 'data_learning\.json|data_monitor\.db|data_monitor\.json\.imported|AGENTS\.local\.md|__pycache__|\.log$'; then
            echo "⛔ 运行时数据或本地私有文件被 git 跟踪，禁止合并"
            exit 1
          fi
          echo "✅ 无运行时数据/私有文件被跟踪"
      - name: 部署细节不得出现在提交文件（占位符规范）
        run: |
          # 只排除模式定义所在的 ci.yml 自身行（行号无关），.github 其余文件照查
          if git grep -nE '/home/|127\.0\.0\.1|/AstrBot/|:6185|docker exec astrbot|docker logs astrbot' -- . \
              | grep -vE '^\.github/workflows/ci\.yml:[0-9]+:'; then
            echo "⛔ 命中本机部署细节，示例一律改用 <astrbot容器>/<端口>/<容器内插件路径> 等占位符（规范见 AGENTS.md §9 纯净交付红线）"
            exit 1
          fi
          echo "✅ 无部署细节泄露"

      - name: 生产数据红线（私有名单经 secret 注入，公开仓库不可见）
        # 名单值存仓库 secret REDLINE_PATTERN（gh secret set，内容=AGENTS.local.md
        # 红线 grep 的完整模式）。为什么用 secret：仓库公开发布，CI 配置里写
        # 字面人名=自己泄露；secret 对公众不可见但 CI 可用。fork PR 取不到
        # secret——该步跳过（本仓库协作以同仓分支为主）。#32 曾把生产人格名/
        # 用户昵称带进注释与测试夹具而 CI 放行，本步封堵该类漏网。
        env:
          REDLINE: ${{ secrets.REDLINE_PATTERN }}
        run: |
          if [ -z "$REDLINE" ]; then
            echo "ℹ️ 未配置 REDLINE_PATTERN secret，本步跳过（名单检查退回本地 AGENTS.local.md 纪律）"
            exit 0
          fi
          if git grep -nE "$REDLINE" -- .               | grep -vE '^\.github/workflows/ci\.yml:[0-9]+:'; then
            echo "⛔ 命中生产数据红线（真实人格名/用户昵称/部署细节），禁止合并——夹具与注释一律用中性占位"
            exit 1
          fi
          echo "✅ 生产数据红线通过"
