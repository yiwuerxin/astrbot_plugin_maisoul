<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麦麦之魂 · maisoul</title>
<style>
/* ===== 主题令牌：取自 MaiBot 部署版原版 dashboard（modern，index-gQUKboHR.css :root） ===== */
:root{
  --primary:28.9 94.8% 45.1%; --primary-foreground:210 40% 98%;
  --background:0 0% 100%; --foreground:222.2 84% 4.9%;
  --card:188.5 14% 98.6%; --card-foreground:222.2 84% 4.9%;
  --secondary:188.5 35% 96%; --secondary-foreground:222.2 47.4% 11.2%;
  --muted:188.5 12% 96%; --muted-foreground:188.5 20% 46.9%;
  --accent:112.7 40.2% 47.8%; --accent-foreground:210 40% 98%;
  --destructive:0 83.9% 44.9%; --destructive-foreground:210 40% 98%;
  --border:188.5 20% 91.4%; --input:188.5 20% 91.4%; --ring:28.9 94.8% 45.1%;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Monaco,monospace;
  --shadow-card:0 1px 3px rgb(0 0 0/.1),0 1px 2px rgb(0 0 0/.06);
  --shadow-sm:0 1px 2px rgb(0 0 0/.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  background:hsl(var(--background));color:hsl(var(--foreground));font-size:16px;line-height:1.5;
}
/* ---------- 应用壳：侧栏（--layout-sidebar-width 13rem）+ 主列（顶栏 h-12 + 滚动内容） ---------- */
#app{display:flex;height:100vh}
.sidebar{width:208px;flex:none;display:flex;flex-direction:column;border-right:1px solid hsl(var(--border));background:hsl(var(--background));transition:width .2s}
.sidebar.mini{width:64px}
.sb-logo{height:80px;flex:none;display:flex;align-items:center;border-bottom:1px solid hsl(var(--border));padding:0 16px;overflow:hidden}
.sidebar.mini .sb-logo{padding:0;justify-content:center}
.sb-logo .lg{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;color:hsl(var(--primary))}
.sb-logo .tx{margin-left:10px;min-width:0;white-space:nowrap}
.sidebar.mini .sb-logo .tx{display:none}
.sb-logo b{display:block;font-size:14px;font-weight:800;letter-spacing:.1em}
.sb-logo small{display:block;font-size:11px;color:hsl(var(--muted-foreground));font-weight:400}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;display:flex;flex-direction:column;gap:12px}
.sb-group{display:flex;flex-direction:column;gap:4px}
.sb-gtitle{min-height:20px;display:flex;align-items:center;padding:0 12px;margin-bottom:8px;color:hsl(var(--muted-foreground)/.6);font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.sidebar.mini .sb-gtitle{display:none}
.sb-item{position:relative;display:flex;height:40px;width:100%;align-items:center;gap:12px;border-radius:8px;padding:0 12px;border:none;background:none;color:hsl(var(--muted-foreground));text-decoration:none;font-size:16px;font-weight:500;font-family:inherit;text-align:left;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.sidebar.mini .sb-item{justify-content:center;padding:0}
.sb-item:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.sb-item.on{background:hsl(var(--accent));color:hsl(var(--foreground))}
.sb-item .ic{display:flex;flex:none;color:inherit}
.sb-item.on .ic{color:hsl(var(--primary))}
.sidebar.mini .sb-item .lb{display:none}
.sb-foot{flex:none;border-top:1px solid hsl(var(--border));padding:10px 16px;font-size:11px;color:hsl(var(--muted-foreground));line-height:1.7;white-space:nowrap}
.sidebar.mini .sb-foot{display:none}
/* ---------- 顶栏：sticky h-12 border-b ---------- */
.maincol{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:48px;flex:none;display:flex;align-items:center;gap:8px;border-bottom:1px solid hsl(var(--border));padding:0 16px;background:hsl(var(--background))}
.tb-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-spacer{flex:1}
@media(max-width:640px){.tb-title{display:none}}
/* ---------- 内容区：space-y + p-4 sm:p-6 ---------- */
.pagescroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.page{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:1080px}
@media(min-width:640px){.page{padding:24px;gap:24px}}
.page-head{display:flex;flex-direction:column;gap:12px}
@media(min-width:640px){.page-head{flex-direction:row;align-items:center;justify-content:space-between}}
.page-head h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
@media(min-width:640px){.page-head h1{font-size:24px}}
@media(min-width:768px){.page-head h1{font-size:30px}}
/* ---------- 配置分区：rounded-lg border bg-card p-4 sm:p-6 space-y-3 ---------- */
.panel{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:8px;box-shadow:var(--shadow-card);padding:16px;display:flex;flex-direction:column;gap:12px}
@media(min-width:640px){.panel{padding:24px}}
.panel>h3{font-size:16px;font-weight:600}
.panel .pdesc{font-size:14px;color:hsl(var(--muted-foreground));line-height:1.6;white-space:pre-line}
.panel .pdesc p{margin:0}
/* ---------- 表单行：label+desc 左，控件右 ---------- */
.frow{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:1px solid hsl(var(--border))}
.frow:last-child{border-bottom-color:transparent}
.frow .fmeta{min-width:0}
.frow .flab{font-size:14px;font-weight:500;line-height:1.4}
.frow .flab .fcnt{font-size:12px;font-weight:400;color:hsl(var(--muted-foreground));margin-left:4px}
.frow .fdesc{font-size:12px;color:hsl(var(--muted-foreground));line-height:1.5;margin-top:2px}
.frow .fctl{min-width:0}
@media(min-width:640px){
  .frow{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 24px}
  .frow .fmeta{flex:1 1 240px}
  .frow .fctl{width:320px;flex:none}
  /* 整行控件（textarea/chips/规则列表）：标签与说明在上方通栏，不与 100% 宽控件同排互相挤宽 */
  .frow.wide{flex-direction:column;align-items:stretch;gap:6px}
  .frow.wide .fmeta{flex:1 1 auto}
  .frow.wide .fctl{width:100%}
  .frow .fctl.free{width:auto}
}
/* ---------- 基础控件（对齐部署版 Input/Textarea/Select） ---------- */
input[type=text],input[type=number],select{width:100%;height:36px;border:1px solid hsl(var(--input));border-radius:6px;background:transparent;padding:0 12px;font-size:14px;font-family:inherit;color:inherit;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
textarea{width:100%;min-height:64px;border:1px solid hsl(var(--input));border-radius:6px;background:transparent;padding:8px 12px;font-size:14px;font-family:inherit;color:inherit;line-height:1.6;resize:vertical;box-shadow:var(--shadow-sm)}
input:focus,textarea:focus,select:focus{outline:none;border-color:hsl(var(--ring));box-shadow:0 0 0 1px hsl(var(--ring))}
input:disabled,textarea:disabled,select:disabled{opacity:.5;cursor:not-allowed}
select{cursor:pointer}
input[type=checkbox]{accent-color:hsl(var(--primary))}
/* ---------- 按钮（对齐部署版 Button cva） ---------- */
.ui-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;border:none;background:transparent;font-size:14px;font-weight:500;font-family:inherit;height:36px;padding:0 16px;cursor:pointer;color:inherit;white-space:nowrap;transition:background .15s,color .15s,opacity .15s}
.ui-btn.default{background:hsl(var(--primary));color:hsl(var(--primary-foreground));box-shadow:0 1px 3px rgb(0 0 0/.12)}
.ui-btn.default:hover{background:hsl(var(--primary)/.9)}
.ui-btn.secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));box-shadow:var(--shadow-sm)}
.ui-btn.secondary:hover{background:hsl(var(--secondary)/.8)}
.ui-btn.outline{border:1px solid hsl(var(--input));background:hsl(var(--background));box-shadow:var(--shadow-sm)}
.ui-btn.outline:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.ui-btn.ghost:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.ui-btn.destructive{background:hsl(var(--destructive));color:hsl(var(--destructive-foreground));box-shadow:var(--shadow-sm)}
.ui-btn.destructive:hover{background:hsl(var(--destructive)/.9)}
.ui-btn.sm{height:32px;padding:0 12px;font-size:12px}
.ui-btn.icon{width:36px;padding:0}
.ui-btn.icon.sm{width:32px}
.ui-btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.ui-btn svg{flex:none}
/* ---------- 开关（对齐部署版 Switch h-5 w-9） ---------- */
label.ui-switch{position:relative;display:inline-flex;height:20px;width:36px;flex:none;align-items:center;border-radius:99px;border:2px solid transparent;background:hsl(var(--input));box-shadow:var(--shadow-sm);cursor:pointer;transition:background .2s}
.ui-switch input{position:absolute;opacity:0;width:0;height:0}
.ui-switch .th{display:block;height:16px;width:16px;border-radius:99px;background:hsl(var(--background));box-shadow:0 1px 3px rgb(0 0 0/.25);transition:transform .2s;pointer-events:none}
.ui-switch input:checked+.th{transform:translateX(16px)}
.ui-switch:has(input:checked){background:hsl(var(--primary))}
.ui-switch:has(input:disabled){opacity:.5;cursor:not-allowed}
/* ---------- 选项卡（对齐部署版 TabsList bg-muted rounded-lg p-1） ---------- */
.ui-tabs{display:inline-flex;height:36px;align-items:center;justify-center;background:hsl(var(--muted));border-radius:8px;padding:4px;gap:2px}
.ui-tabs button{border:none;background:transparent;color:hsl(var(--muted-foreground));border-radius:6px;padding:5px 12px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s}
.ui-tabs button.on{background:hsl(var(--background));color:hsl(var(--foreground));box-shadow:var(--shadow-sm)}
.ui-tabs.full{display:grid;width:100%}
/* ---------- 徽章（对齐部署版 Badge rounded-md px-2.5 text-xs font-semibold） ---------- */
.ui-badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;border:1px solid hsl(var(--border));padding:2px 10px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap;color:hsl(var(--foreground));background:transparent}
.ui-badge.default{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:transparent}
.ui-badge.secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));border-color:transparent}
.ui-badge.destructive{background:hsl(var(--destructive));color:hsl(var(--destructive-foreground));border-color:transparent}
.ui-badge.soft{background:hsl(var(--muted));color:hsl(var(--muted-foreground));border-color:transparent}
/* ---------- 统计卡（对齐首页 stat：text-xs label + text-lg font-semibold tabular-nums） ---------- */
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:1024px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.statc{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:8px;box-shadow:var(--shadow-card);padding:12px 16px}
.statc small{font-size:12px;color:hsl(var(--muted-foreground))}
.statc b{display:block;margin-top:4px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statc b.big{font-size:24px;font-weight:700;letter-spacing:-.02em;color:hsl(var(--primary))}
/* ---------- 表格（对齐部署版 Table） ---------- */
table.ui-tbl{width:100%;border-collapse:collapse;font-size:14px}
.ui-tbl th{text-align:left;font-weight:500;color:hsl(var(--muted-foreground));font-size:12px;padding:8px 12px;border-bottom:1px solid hsl(var(--border));white-space:nowrap}
.ui-tbl td{padding:8px 12px;border-bottom:1px solid hsl(var(--border));vertical-align:middle}
.ui-tbl tbody tr:hover td{background:hsl(var(--muted)/.5)}
.ui-tbl tr:last-child td{border-bottom:none}
.ui-tbl .empty-cell{padding:22px;text-align:center;color:hsl(var(--muted-foreground));font-size:13px}
.tbl-check{width:16px;height:16px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.row{grid-template-columns:1fr}}
/* ---------- chips 输入 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;border:1px solid hsl(var(--input));border-radius:6px;padding:6px;background:transparent;box-shadow:var(--shadow-sm)}
.chips:focus-within{border-color:hsl(var(--ring));box-shadow:0 0 0 1px hsl(var(--ring))}
.chips input{border:none;box-shadow:none;background:transparent;min-width:100px;flex:1;height:28px;padding:0 6px}
.chips input:focus{box-shadow:none;border:none}
.chip-tag{display:inline-flex;align-items:center;gap:5px;background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.chip-tag i{cursor:pointer;font-style:normal;opacity:.6;font-weight:400;font-family:inherit}
.chip-tag i:hover{opacity:1}
/* ---------- 模式选择卡（radio cards） ---------- */
.modes{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.modes{grid-template-columns:repeat(3,1fr)}}
.mode{border:1px solid hsl(var(--border));border-radius:8px;padding:12px 16px;cursor:pointer;transition:all .15s;background:transparent}
.mode:hover{background:hsl(var(--muted)/.5)}
.mode.on{border-color:hsl(var(--primary));background:hsl(var(--primary)/.05);box-shadow:0 0 0 1px hsl(var(--primary))}
.mode b{font-size:14px;font-weight:600;display:block}
.mode.on b{color:hsl(var(--primary))}
.mode p{font-size:12px;color:hsl(var(--muted-foreground));margin-top:4px;line-height:1.5}
/* ---------- 滑杆 ---------- */
.fslider{display:flex;align-items:center;gap:12px;width:100%}
.fslider input[type=range]{flex:1;accent-color:hsl(var(--primary));height:20px}
.slider-val{font-size:12px;font-weight:600;color:hsl(var(--secondary-foreground));background:hsl(var(--secondary));border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums;flex:none}
.sunit{color:hsl(var(--muted-foreground));font-size:12px;flex:none}
/* ---------- 列表行（规则/绑定行） ---------- */
.cp-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid hsl(var(--border))}
.cp-row:last-child{border-bottom-color:transparent}
.cp-row input,.cp-row select{width:auto;flex:none}
.style-item{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.style-item textarea{min-height:52px;flex:1}
.lr-toggle{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.lr-toggle small{font-size:11px;color:hsl(var(--muted-foreground))}
.icon-del{width:32px;height:32px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid hsl(var(--input));border-radius:6px;background:hsl(var(--background));color:hsl(var(--muted-foreground));cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm)}
.icon-del:hover{color:hsl(var(--destructive));border-color:hsl(var(--destructive)/.5)}
/* ---------- 工具栏与搜索 ---------- */
.tbl-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tbl-toolbar .search{position:relative;flex:1;min-width:200px;max-width:340px}
.tbl-toolbar .search input{padding-left:34px}
.tbl-toolbar .search .sic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:hsl(var(--muted-foreground));display:flex;pointer-events:none}
.lab{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.lab>span{font-size:13px;font-weight:600;flex:none}
.lab select{width:auto}
/* ---------- 弹窗（对齐部署版 Dialog：mask + rounded-lg border shadow） ---------- */
.modal-mask{position:fixed;inset:0;background:rgb(0 0 0/.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto}
.modal{background:hsl(var(--background));border:1px solid hsl(var(--border));border-radius:8px;box-shadow:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1);width:100%;max-width:640px;animation:pop .15s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 24px 0}
.modal-head b{font-size:16px;font-weight:600}
.modal-head .desc{font-size:13px;color:hsl(var(--muted-foreground));margin-top:4px;line-height:1.5}
.modal-x{border:none;background:none;cursor:pointer;color:hsl(var(--muted-foreground));padding:4px;border-radius:6px;display:flex}
.modal-x:hover{color:hsl(var(--foreground));background:hsl(var(--muted))}
.modal-body{padding:16px 24px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 24px 20px}
/* ---------- 暴露工具/技能 弹窗列表 ---------- */
.tp-list{max-height:46vh;overflow-y:auto;border:1px solid hsl(var(--border));border-radius:8px;background:hsl(var(--background));display:flex;flex-direction:column}
.tp-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid hsl(var(--border));transition:background .1s}
.tp-item:last-child{border-bottom:none}
.tp-item:hover{background:hsl(var(--muted)/.5)}
.tp-item.on{background:hsl(var(--primary)/.06)}
.tp-check{flex:none;width:16px;height:16px;margin-top:3px;border:1px solid hsl(var(--input));border-radius:4px;background:hsl(var(--background));display:flex;align-items:center;justify-content:center;color:hsl(var(--primary-foreground))}
.tp-item.on .tp-check{background:hsl(var(--primary));border-color:hsl(var(--primary))}
.tp-info{min-width:0;flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tp-info b{font-family:var(--mono);font-size:13px;font-weight:600}
.tp-info small{width:100%;font-size:12px;color:hsl(var(--muted-foreground));line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-empty{padding:26px;text-align:center;color:hsl(var(--muted-foreground));font-size:13px}
.tp-foot small{color:hsl(var(--muted-foreground));font-size:12px}
/* ---------- 其他 ---------- */
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(80px);background:hsl(var(--foreground));color:hsl(var(--background));padding:10px 22px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;z-index:99;box-shadow:0 4px 12px rgb(0 0 0/.2)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.loading{padding:60px;text-align:center;color:hsl(var(--muted-foreground));font-size:14px}
code{font-family:var(--mono);font-size:.9em;background:hsl(var(--muted));border-radius:4px;padding:1px 5px;color:hsl(var(--secondary-foreground))}
/* ===== 麦麦观察页（像素对齐 MaiBot 部署版原版 dashboard /planner-monitor：颜色/字号/圆角/类名均取自部署 chunk 实测值） ===== */
:root{
  --mo-primary:#e06f06; --mo-primary-fg:#f8fafc;
  --mo-bg:#ffffff; --mo-fg:#020817;
  --mo-card:#fbfcfc; --mo-card-fg:#020817;
  --mo-secondary:#f1f7f8; --mo-secondary-fg:#0f172a;
  --mo-muted:#f4f6f6; --mo-muted-fg:#608990;
  --mo-accent:#55ab49; --mo-accent-fg:#f8fafc;
  --mo-border:#e5eced; --mo-destructive:#d31212;
  --mo-emerald:#10b981; --mo-blue:#3b82f6; --mo-amber:#f59e0b;
  --mo-teal:#14b8a6; --mo-purple:#a855f7; --mo-red:#ef4444;
  --mo-mono:"JetBrains Mono",ui-monospace,monospace;
  --mo-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
}
/* 布局根：flex min-w-0 flex-col gap-4 lg:h-[calc(100vh-116px)] lg:flex-row */
/* ---------- 模型管理（仿 MaiBot /config/model） ---------- */
.md-grid{display:grid;gap:16px}
@media(min-width:1024px){.md-grid{grid-template-columns:1fr 3fr;align-items:start}}
.md-aside{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:8px;overflow:hidden;box-shadow:var(--shadow-card)}
.md-ahead{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid hsl(var(--border));padding:10px 12px}
.md-ahead h2{font-size:14px;font-weight:600;margin:0}
.md-alist{display:flex;flex-direction:column;gap:4px;padding:8px}
.md-item{display:flex;width:100%;min-width:0;align-items:justify;justify-content:space-between;gap:12px;border:none;background:none;border-radius:6px;padding:8px 12px;font-size:14px;font-family:inherit;text-align:left;cursor:pointer;transition:background .15s;color:inherit}
.md-item:hover{background:hsl(var(--accent))}
.md-item.on{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.md-item .l2{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.md-item .lbl{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-item .sub{font-size:11px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-item .cnt{flex:none;font-size:12px;opacity:.8}
.md-item .cnt.ok{color:var(--mo-ok,#16a34a);opacity:1}
.md-item.on .cnt.ok{color:inherit;opacity:.9}
.md-item.off .lbl{opacity:.5}
.md-main{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:8px;padding:16px;box-shadow:var(--shadow-card);min-width:0}
.md-bar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
@media(min-width:640px){.md-bar{flex-direction:row;align-items:center;justify-content:space-between}}
.md-search{position:relative;width:100%;max-width:384px}
.md-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.md-search input{padding-left:32px}
.md-found{font-size:14px;color:hsl(var(--muted-foreground));margin:0;white-space:nowrap}
.md-provbar{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid hsl(var(--border));border-radius:8px;padding:12px 16px;margin-bottom:12px}
.md-provbar h3{font-size:15px;font-weight:600;margin:0 0 4px}
.md-provbar p{font-size:12px;color:hsl(var(--muted-foreground));margin:0}
.md-dotcell{text-align:center;width:56px}
.md-dot{display:inline-block;width:12px;height:12px;border-radius:999px;border:1px solid rgba(21,128,61,.4);background:rgba(21,128,61,.12)}
.md-dot.on{border-color:#22c55e;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.md-alert{border:1px solid rgba(234,179,8,.5);background:rgba(234,179,8,.1);border-radius:8px;padding:12px 16px;font-size:14px}
.md-alert strong{color:#ca8a04;display:flex;align-items:center;gap:6px}
.md-alert-body{margin-top:8px;font-size:14px}
.md-thead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid hsl(var(--border));padding-bottom:10px;margin-bottom:14px}
.md-thead h3{font-size:17px;font-weight:600;margin:0;white-space:nowrap}
.md-thead p{font-size:13px;color:hsl(var(--muted-foreground));margin:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.md-fld>label{font-size:14px;font-weight:500}
.md-hint{font-size:12px;color:hsl(var(--muted-foreground));margin:0}
.md-caps{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.md-cap{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:hsl(var(--muted-foreground));line-height:1.5}
.md-cap>span:last-child{min-width:0}
.md-note{font-size:12px;color:hsl(var(--muted-foreground));border-top:1px solid hsl(var(--border));margin:14px 0 0;padding-top:10px}
.md-savest{display:flex;justify-content:flex-end;font-size:12px;color:hsl(var(--muted-foreground));margin-top:6px;min-height:16px}
.md-ms{position:relative}
.md-ms-trig{display:flex;width:100%;min-height:36px;align-items:center;justify-content:space-between;gap:8px;border:1px solid hsl(var(--input));border-radius:6px;background:transparent;padding:4px 12px;font-family:inherit;cursor:pointer;box-shadow:var(--shadow-sm)}
.md-ms-trig:hover{background:hsl(var(--accent))}
.md-ms-badges{display:flex;flex:1;flex-wrap:wrap;gap:4px;min-width:0}
.md-ms-ph{color:hsl(var(--muted-foreground));font-size:14px}
.md-tag{gap:4px;padding:1px 6px;font-size:11px;line-height:1.4;max-width:100%}
.md-tag>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-tag i{display:inline-flex;cursor:pointer;border-radius:4px;font-style:normal}
.md-tag i:hover{background:rgba(220,38,38,.2)}
.md-ms-pop{position:absolute;z-index:30;top:calc(100% + 4px);left:0;right:0;background:hsl(var(--card));color:hsl(var(--foreground));border:1px solid hsl(var(--border));border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.md-ms-search{display:flex;align-items:center;gap:6px;border-bottom:1px solid hsl(var(--border));padding:8px 12px}
.md-ms-search svg{opacity:.5;flex:none}
.md-ms-search input{border:none;box-shadow:none;padding:0;background:transparent;height:24px}
.md-ms-search input:focus{box-shadow:none;border:none}
.md-ms-list{max-height:300px;overflow-y:auto;padding:4px}
.md-ms-item{display:flex;align-items:center;gap:8px;border-radius:6px;padding:6px 8px;font-size:14px;cursor:pointer}
.md-ms-item:hover{background:hsl(var(--accent))}
.md-ms-item.on{background:hsl(var(--accent))}
.md-check{display:inline-flex;width:16px;flex:none;color:var(--mo-ok,#16a34a)}
.md-ms-empty{padding:20px 0;text-align:center;font-size:14px;color:hsl(var(--muted-foreground))}
.mo-root{display:flex;flex-direction:column;gap:16px;min-width:0;font-family:inherit;color:var(--mo-fg);height:calc(100vh - 120px);min-height:420px}
@media(min-width:1024px){.mo-root{flex-direction:row}}
/* 侧栏：border bg-background/45 flex shrink-0 flex-col overflow-hidden；w-52/w-16 */
.mo-aside{flex:none;min-width:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--mo-border);background:rgba(255,255,255,.45);transition:width .2s;width:208px}
.mo-aside.collapsed{width:64px}
.mo-aside-head{padding:8px 12px}
.mo-aside.collapsed .mo-aside-head{padding:8px}
.mo-aside-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin:0;color:var(--mo-fg)}
.mo-aside.collapsed .mo-aside-title{justify-content:center;font-size:0}
.mo-aside-title .mo-ticon{flex:none;display:flex}
.mo-aside.collapsed .mo-ticon{display:none}
.mo-conn{display:flex;width:8px;height:8px;border-radius:99px;background:var(--mo-emerald);margin-left:auto;flex:none}
.mo-aside.collapsed .mo-conn{margin-left:0}
.mo-sep{height:1px;background:var(--mo-border);flex:none}
/* ghost 按钮（折叠钮/回到底部/清空）：hover:bg-accent hover:text-accent-foreground */
.mo-gbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:none;background:none;border-radius:6px;color:inherit;font-weight:500;cursor:pointer;transition:background .15s,color .15s;height:24px;padding:0 8px;font-size:11px;flex:none}
.mo-gbtn:hover{background:var(--mo-accent);color:var(--mo-accent-fg)}
.mo-gbtn.icon{width:24px;padding:0}
/* 会话列表：flex flex-col gap-1 p-2；ScrollArea max-h-40 lg:max-h-none */
.mo-sessions{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:4px;padding:8px;max-height:160px}
@media(min-width:1024px){.mo-sessions{max-height:none}}
.mo-aside.collapsed .mo-sessions{align-items:center}
/* 会话项：rounded-lg text-left text-sm hover:bg-accent/50；选中 bg-accent text-accent-foreground */
.mo-sess{border:none;background:none;max-width:100%;overflow:hidden;border-radius:8px;text-align:left;font-size:14px;transition:background .15s;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;width:100%;min-width:0;color:inherit}
.mo-sess:hover{background:rgba(85,171,73,.5)}
.mo-sess.on{background:var(--mo-accent);color:var(--mo-accent-fg)}
.mo-aside.collapsed .mo-sess{display:flex;height:40px;width:40px;align-items:center;justify-content:center;padding:0;flex:none}
.mo-sess .r1{display:flex;width:100%;min-width:0;align-items:center;justify-content:space-between;gap:8px}
.mo-aside.collapsed .mo-sess .r1{justify-content:center}
.mo-sess .r1 .lft{display:flex;min-width:0;align-items:center;gap:8px;overflow:hidden;flex:1}
.mo-aside.collapsed .mo-sess .r1 .lft{flex:none}
.mo-sname{display:block;min-width:0;flex:1;overflow:hidden;font-weight:500;text-overflow:ellipsis;white-space:nowrap}
.mo-aside.collapsed .mo-sname,.mo-aside.collapsed .r2{display:none}
/* 会话头像：relative h-7 w-7；rounded-md bg-primary/10 text-primary + 状态点 h-2.5 ring-2 */
.mo-sava{position:relative;display:flex;height:28px;width:28px;flex:none}
.mo-sava .img{height:28px;width:28px;border-radius:6px;background:rgba(224,111,6,.1);color:var(--mo-primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.mo-sdot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:99px;box-shadow:0 0 0 2px var(--mo-bg);background:var(--mo-emerald)}
.mo-sdot.wait{background:var(--mo-blue)}
.mo-sess .r2{display:flex;width:100%;min-width:0;align-items:center;justify-content:space-between;gap:8px;overflow:hidden;font-size:12px;color:var(--mo-muted-fg)}
.mo-sess .r2 .tm{flex:none}
.mo-sess .r2 .stg{color:var(--mo-primary);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mo-sess.on .r2,.mo-sess.on .r2 .stg{color:var(--mo-accent-fg)}
.mo-sess-empty{color:var(--mo-muted-fg);display:flex;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px}
.mo-sess-empty p{font-size:14px;text-align:center;margin:0}
/* 主列：flex min-w-0 flex-1 flex-col */
.mo-main{display:flex;min-width:0;flex:1;flex-direction:column}
/* 阶段条：mb-1.5 flex items-center gap-2 overflow-x-auto rounded-md border px-2 py-1（有状态 bg-background / 无 bg-muted/30） */
.mo-stagebar{background:var(--mo-bg);margin-bottom:6px;display:flex;min-width:0;align-items:center;gap:8px;overflow-x:auto;border:1px solid var(--mo-border);border-radius:6px;padding:4px 8px;flex:none}
.mo-stagebar.empty{background:rgba(244,246,246,.3)}
.mo-stagegrp{display:flex;flex:none;align-items:center;gap:6px}
.mo-emptytxt{color:var(--mo-muted-fg);flex:none;font-size:12px;white-space:nowrap}
.mo-upd{color:var(--mo-muted-fg);margin-left:auto;font-size:11px;white-space:nowrap;flex:none}
.mo-sdetail{color:var(--mo-muted-fg);flex:none;font-size:12px;white-space:nowrap;margin:0}
/* 统计 chip：bg-background/60 h-6 rounded-md border px-1.5 + activity h-3 w-3 + 统计 text-[10px] font-medium */
.mo-stats{background:rgba(255,255,255,.6);color:var(--mo-muted-fg);display:flex;height:24px;flex:none;align-items:center;gap:4px;border-radius:6px;border:1px solid var(--mo-border);padding:0 6px;cursor:default;white-space:nowrap}
.mo-stats .lbl{font-size:10px;font-weight:500}
.mo-act{margin-left:auto;display:flex;flex:none;align-items:center;gap:6px}
.mo-act .mo-gbtn .chev.on{color:var(--mo-primary)}
/* Badge 基类：inline-flex items-center rounded-md border px-2.5 py-0.5 text-xs font-semibold */
.mo-badge{display:inline-flex;align-items:center;border-radius:6px;border:1px solid var(--mo-border);padding:2px 10px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap;flex:none;color:var(--mo-fg);background:transparent}
.mo-badge.default{background:var(--mo-primary);color:var(--mo-primary-fg);border-color:transparent}
.mo-badge.secondary{background:var(--mo-secondary);color:var(--mo-secondary-fg);border-color:transparent}
.mo-badge.destructive{background:var(--mo-destructive);color:#fff;border-color:transparent}
.mo-badge.outline{background:transparent;color:var(--mo-fg)}
/* monitor 内覆盖：text-[10px] / px-1.5 text-[10px] / h-5 px-1.5 / h-4 px-1 / text-xs font-normal / gap-1 */
.mo-badge.t10{font-size:10px}
.mo-badge.p6{padding-left:6px;padding-right:6px}
.mo-badge.h20{height:20px;padding-left:6px;padding-right:6px;font-size:10px}
.mo-badge.h16{height:16px;padding-left:4px;padding-right:4px;font-size:10px}
.mo-badge.fnorm{font-weight:400}
.mo-badge.g1{gap:4px}
.mo-badge.g05{gap:2px}
/* 时间线 Card：min-h-[420px] min-w-0 flex-1 overflow-hidden lg:min-h-0 + Card bg-card rounded-lg border shadow */
.mo-tlcard{background:var(--mo-card);border-radius:8px;border:1px solid var(--mo-border);box-shadow:var(--mo-shadow);min-width:0;flex:1;overflow:hidden}
.mo-tl{height:100%;overflow-y:auto}
.mo-tlin{min-width:0;padding:16px}
.mo-empty{color:var(--mo-muted-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:80px 0}
.mo-empty p{font-size:14px;margin:0}
.mo-empty small{font-size:12px;opacity:.6}
/* 事件行：外层 pb-3；内层 rounded-md fade-in-0 slide-in-from-bottom-2 duration-300 */
.mo-e{padding-bottom:12px}
.mo-ein{border-radius:6px;animation:moIn .3s ease-out}
@keyframes moIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mo-row{display:flex;align-items:flex-start;gap:12px}
/* 圆头像：mt-1 h-7 w-7 rounded-full */
.mo-ava{margin-top:4px;display:flex;height:28px;width:28px;flex:none;align-items:center;justify-content:center;border-radius:99px;font-size:12px;font-weight:600}
.mo-ava.in{background:rgba(59,130,246,.15);color:var(--mo-blue)}
.mo-ava.out{background:rgba(16,185,129,.15);color:var(--mo-emerald)}
.mo-ava.amber{background:rgba(245,158,11,.15);color:var(--mo-amber)}
.mo-ecol{min-width:0;flex:1}
.mo-ehead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mo-ehead.wrap{flex-wrap:wrap}
.mo-ename{font-size:14px;font-weight:500;color:var(--mo-fg)}
.mo-ets{color:var(--mo-muted-fg);font-size:12px;white-space:nowrap}
.mo-ets.md{font-weight:500}
.mo-cpt{color:rgba(2,8,23,.8);font-size:14px;line-height:1.625;white-space:pre-wrap;word-break:break-word;margin:0}
.mo-cpt.f90{color:rgba(2,8,23,.9)}
.mo-cpt.mut{color:var(--mo-muted-fg)}
.mo-cpt2{color:var(--mo-muted-fg);font-size:14px;margin:4px 0 0}
/* 发送卡：rounded-md border border-emerald-500/30 bg-emerald-500/5 px-3 py-2 */
.mo-card-sent{display:flex;align-items:flex-start;gap:12px;border:1px solid rgba(16,185,129,.3);background:rgba(16,185,129,.05);border-radius:6px;padding:8px 12px}
/* 反应卡：bg-background rounded-md border px-3 py-2 shadow-sm */
.mo-card-gate{background:var(--mo-bg);display:flex;align-items:flex-start;gap:12px;border-radius:6px;border:1px solid var(--mo-border);padding:8px 12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
/* 打断卡：rounded-md border border-amber-500/35 bg-amber-500/5 px-3 py-2 */
.mo-card-warn{border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.05);border-radius:6px;padding:8px 12px}
.mo-card-warn .hd{display:flex;align-items:center;gap:8px;font-size:14px}
.mo-card-warn b{font-weight:500}
/* 结束卡：rounded-md border border-emerald-500/30 bg-emerald-500/5 px-3 py-2 */
.mo-card-done{border-radius:6px;border:1px solid rgba(16,185,129,.3);background:rgba(16,185,129,.05);padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:14px}
.mo-card-done b{font-weight:500}
.mo-card-done .m{color:var(--mo-muted-fg)}
/* 工具卡内的结束条：px-2.5 py-1.5 text-xs */
.mo-done-strip{display:flex;align-items:center;gap:8px;border-radius:6px;border:1px solid rgba(16,185,129,.3);background:rgba(16,185,129,.05);padding:6px 10px;font-size:12px}
.mo-done-strip b{font-weight:500}
.mo-done-strip .m{color:var(--mo-muted-fg)}
/* 左边框 Card：bg-card rounded-lg border shadow + border-l-4（emerald/teal/purple 60%） */
.mo-card{background:var(--mo-card);border-radius:8px;border:1px solid var(--mo-border);border-left-width:4px;box-shadow:var(--mo-shadow)}
.mo-card.plan{border-left-color:rgba(16,185,129,.6)}
.mo-card.tools{border-left-color:rgba(20,184,166,.6)}
.mo-card.replier{border-left-color:rgba(168,85,247,.6)}
.mo-cbody{display:flex;flex-direction:column;gap:12px;padding:12px 16px}
.mo-cbody.g8{gap:8px}
.mo-cbody.rp{gap:8px;padding:10px 16px}
.mo-chead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mo-chead.nowrap{flex-wrap:nowrap}
.mo-ctitle{font-size:14px;font-weight:500;line-height:1;margin:0}
.mo-ic{display:flex;flex:none;align-items:center}
.mo-okc{color:var(--mo-emerald)}
.mo-badc{color:var(--mo-red)}
.mo-tealc{color:var(--mo-teal)}
.mo-purplec{color:var(--mo-purple)}
.mo-amberc{color:var(--mo-amber)}
/* 折叠文本：text-sm leading-relaxed；按钮 text-primary mt-1 text-xs hover:underline */
.mo-cbtn{color:var(--mo-primary);margin-top:4px;display:flex;align-items:center;gap:2px;font-size:12px;border:none;background:none;cursor:pointer;padding:0}
.mo-cbtn:hover{text-decoration:underline}
/* planner.response 工具 chip：badge secondary gap-1 text-[10px] + wrench h-2.5 */
.mo-chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
/* 工具行 */
.mo-trow{display:flex;flex-direction:column;gap:6px}
.mo-thead{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mo-tname{color:var(--mo-fg);font-family:var(--mo-mono);font-size:14px;font-weight:600}
.mo-tidx{color:var(--mo-muted-fg);margin-left:auto;font-size:10px;flex:none}
.mo-args{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mo-arg{background:rgba(255,255,255,.6);display:flex;height:24px;max-width:100%;min-width:0;align-items:center;gap:6px;border-radius:6px;border:1px solid var(--mo-border);padding:0 8px;font-size:12px}
.mo-arg b{color:var(--mo-fg);flex:none;font-family:var(--mo-mono);font-weight:600}
.mo-arg .eq{color:var(--mo-muted-fg);flex:none}
.mo-arg i{font-style:normal;color:var(--mo-muted-fg);max-width:288px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mo-mono);font-size:11px}
.mo-result{background:rgba(244,246,246,.2);display:flex;align-items:flex-start;gap:6px;border-radius:6px;border:1px solid var(--mo-border);padding:4px 10px}
.mo-result span{color:var(--mo-muted-fg);flex:none;font-size:10px;line-height:16px;font-weight:500}
.mo-result p{color:rgba(2,8,23,.8);min-width:0;flex:1;font-size:12px;line-height:16px;word-break:break-word;white-space:pre-wrap;margin:0}
.mo-resc{flex:1;min-width:0}
.mo-rbtn{border:none;background:none;cursor:pointer;color:hsl(var(--primary));height:24px;padding:0 8px;border-radius:6px;font-size:10px;font-weight:500;display:inline-flex;align-items:center;gap:4px;flex:none}
.mo-rbtn:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.mo-result .mo-resp{color:rgba(2,8,23,.8);font-size:12px;line-height:16px}
.mo-result .mo-resp:empty::before{content:'未返回结果摘要。';color:var(--mo-muted-fg)}
/* 完整调用 JSON：details group contents；summary 虚线框 h-6 */
.mo-json{display:contents;font-size:12px}
.mo-json summary{background:rgba(255,255,255,.4);color:var(--mo-muted-fg);margin-left:auto;display:flex;height:24px;cursor:pointer;list-style:none;align-items:center;gap:4px;border-radius:4px;border:1px dashed var(--mo-border);padding:0 6px;font-size:10px;flex:none}
.mo-json summary::-webkit-details-marker{display:none}
.mo-json summary svg{transition:transform .15s}
.mo-json[open] summary svg{transform:rotate(90deg)}
.mo-json pre{background:rgba(255,255,255,.6);color:var(--mo-muted-fg);flex-basis:100%;border-radius:6px;border:1px solid var(--mo-border);padding:6px 10px;font-family:var(--mo-mono);font-size:11px;line-height:16px;word-break:break-word;white-space:pre-wrap;margin:0}

<script>
/* AstrBot 在 body 结束处注入 bridge SDK（晚于本脚本执行）；且资源令牌 60s 过期，
   浏览器缓存旧 HTML 时 SDK 可能 401 永不出现 —— 因此内置协议兼容的备用桥。
   注意：脚本内不要出现 body 或 script 的闭合标签字面量，避免被注入逻辑误伤。 */
let S = null;
let FB = null;
let maisoulTab = 'core';
function setMsTab(t){maisoulTab=t;render('maisoul')}
const TITLES = {overview:'概览',maisoul:'麦麦设置',personamgr:'人格管理',rhythm:'发言节奏',learn:'学习',bridge:'管家桥',observe:'麦麦观察',models:'模型管理'};
const PAGE_VERSION = 'v6.13.0';

const sleep = ms => new Promise(r => setTimeout(r, ms));

function makeFallbackBridge(){
  const CHANNEL = 'astrbot-plugin-page';
  const pending = new Map();
  let counter = 0;
  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const m = event.data;
    if (!m || m.channel !== CHANNEL || m.kind !== 'response') return;
    const p = pending.get(m.requestId);
    if (!p) return;
    pending.delete(m.requestId);
    if (m.ok) p.resolve(m.data); else p.reject(new Error(m.error || 'bridge request failed'));
  });
  window.parent.postMessage({channel: CHANNEL, kind: 'ready'}, '*');
  const request = (action, payload) => new Promise((resolve, reject) => {
    const requestId = 'maisoul_fb_' + (++counter);
    pending.set(requestId, {resolve, reject});
    window.parent.postMessage({channel: CHANNEL, kind: 'request', requestId, action, ...payload}, '*');
    setTimeout(() => { if (pending.has(requestId)) { pending.delete(requestId); reject(new Error('请求超时')); } }, 15000);
  });
  return {
    apiGet: (endpoint, params) => request('api:get', {endpoint, params: params || {}}),
    apiPost: (endpoint, body) => request('api:post', {endpoint, body: body || {}}),
  };
}

function getBridge(){ return window.AstrBotPluginPage || FB }
async function ensureBridge(timeout=2500){
  const t0 = Date.now();
  while (Date.now() - t0 < timeout) {
    if (window.AstrBotPluginPage) return window.AstrBotPluginPage;
    await sleep(120);
  }
  FB = makeFallbackBridge();
  return FB;
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
async function apiGet(name,params){ const b=getBridge(); if(!b) throw new Error('WebUI 桥未就绪，请从 AstrBot WebUI 插件页进入'); const r=await b.apiGet(name,params||{}); if(r&&r.success===false) throw new Error(r.error||'读取失败'); return r?.data??r }
async function apiPost(name,body){ const b=getBridge(); if(!b) throw new Error('WebUI 桥未就绪'); const r=await b.apiPost(name,body); if(r&&r.success===false) throw new Error(r.error||'保存失败'); return r }

/* ---------------- 页面切换 ---------------- */
/* ---------------- 渲染辅助（对齐部署版动态配置表单：分区 panel + 表单行 frow） ---------------- */
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
/* 配置分区：rounded-lg border bg-card p-4 sm:p-6 space-y-3 + h3 + 描述（部署版 bot 配置分区样式） */
function panel(id,title,desc,inner){
  return `<section class="panel" id="card_${id}">${title?`<h3>${title}</h3>`:''}${desc?`<div class="pdesc">${desc}</div>`:''}<div>${inner}</div></section>`
}
function card(id,title,desc,inner){ return panel(id,title,desc,inner) }
/* 表单行：label+说明左侧，控件右侧（sm 起两栏）；wide=true 控件整行 */
function field(label,desc,inner,cnt,wide){
  return `<div class="frow ${wide?'wide':''}"><div class="fmeta"><div class="flab"><span>${label}</span>${cnt?`<span class="fcnt">${cnt}</span>`:''}</div>${desc?`<div class="fdesc">${desc}</div>`:''}</div><div class="fctl">${inner}</div></div>`
}
function textarea(id,v,ph){return `<textarea id="${id}" placeholder="${esc(ph||'')}">${esc(v)}</textarea>`}
function chips(id,arr,ph){return `<div class="chips" data-chips="${id}">${(arr||[]).map((t,i)=>`<span class="chip-tag">${esc(t)}<i onclick="delChip('${id}',${i})">×</i></span>`).join('')}<input placeholder="${esc(ph||'输入后回车添加')}" onkeydown="if(event.key==='Enter'){event.preventDefault();addChip('${id}',this)}"></div>`}
function slider(id,v,min,max,step,unit){return `<div class="fslider"><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}" oninput="onFreqSlide(this)"><span class="slider-val" id="${id}v">${v}</span>${unit?`<small class="sunit">${unit}</small>`:''}</div>`}
/* 开关行：部署版 Switch h-5 w-9（选中 primary），标题+副文案在左 */
function switchRow(id,v,title,sub){return `<div class="frow"><div class="fmeta"><div class="flab">${title}</div>${sub?`<div class="fdesc">${sub}</div>`:''}</div><div class="fctl free"><label class="ui-switch"><input type="checkbox" id="${id}" ${v?'checked':''}><span class="th"></span></label></div></div>`}
/* 小按钮（部署版 Button size=sm）带 lucide 图标 */
function smBtn(cls,icon,txt,attrs){return `<button class="ui-btn sm ${cls||'outline'}" ${attrs||''}>${icon?moIcon(icon,14):''}<span>${txt}</span></button>`}
function iconBtn(icon,title,attrs,danger){return `<button class="ui-btn ghost icon sm" title="${esc(title)}" ${attrs||''} style="${danger?'color:hsl(var(--destructive))':''}">${moIcon(icon,14)}</button>`}

function onFreqSlide(el){
  document.getElementById(el.id+'v').textContent=el.value;
  if(el.id!=='talk_value')return;
  const f=parseFloat(el.value);
  const mode=document.getElementById('reply_trigger_mode')?.value||S.reply_trigger_mode||'frequency';
  const th=f>0?Math.ceil(mode==='reply_necessity'?1/(f*f):1/f):0;
  const tip=document.getElementById('freq_tip');
  if(tip)tip.textContent=`触发阈值 = ceil(1/${mode==='reply_necessity'?'f²':'f'}) = ${th} 条积压消息${f<=0?'（频率 0 = 静默接收，不发言）':''}`;
}

  const sb=document.getElementById('sb');if(!sb)return;
  sb.classList.toggle('mini');
  const btn=document.getElementById('tb_sb');
  if(btn)btn.innerHTML=moIcon(sb.classList.contains('mini')?'chevron-right':'chevron-left',16);
}

    maisoul: ()=>{
      const core = [

        ),
        panel('express','表达风格','麦麦平时说话的风格，例如简短、温和、吐槽或正式。',
          field('表达风格（reply_style）','麦麦平时说话的风格，例如简短、温和、吐槽或正式。',textarea('reply_style',S.reply_style,''),`${String(S.reply_style||'').length} 字`,true)
        ),
        panel('preset','预设对话','示例对话展示麦麦应有的说话风格，生成回复时作为风格参考注入；只参考语气与用词，不照搬内容。',
          `<div id="pds">${(S.preset_dialogues||[]).map((d,i)=>pdRow(i,d)).join('')}</div>
           ${smBtn('outline','plus','添加示例对话','onclick="addPdRow()"')}`
        ),
        panel('behave','行为风格','Planner 使用的行动准则，例如何时参与聊天、如何观察局面以及何时保持安静。',
          field('行为风格（behavior_style）','Planner 使用的行动准则，例如何时参与聊天、如何观察局面以及何时保持安静。',textarea('behavior_style',S.behavior_style,''),`${String(S.behavior_style||'').length} 字`,true)
        ),
        panel('attn','群聊注意事项','群聊通用提示词，告诉麦麦群聊中该怎么说话。',
          field('群聊提示词（group_chat_prompt）','群聊通用提示词，告诉麦麦群聊中该怎么说话。',textarea('group_chat_prompt',S.group_chat_prompt,''),`${String(S.group_chat_prompt||'').length} 字`,true)
        ),
        panel('pattn','私聊提示词','私聊通用提示词，告诉麦麦私聊中该怎么说话。',
          field('私聊提示词（private_chat_prompts）','私聊通用提示词，告诉麦麦私聊中该怎么说话。',textarea('private_chat_prompts',S.private_chat_prompts||'',''),`${String(S.private_chat_prompts||'').length} 字`,true)
        ),
      ].join('');
      const detail = [
        panel('lottery','随机风格彩票','备用说话风格；触发后只影响本次回复。',
          `<div id="mrs">${(S.multiple_reply_style||[]).map((t,i)=>styleItem(i,t)).join('')}</div>
           ${smBtn('outline','plus','添加备用风格','onclick="addStyle()"')}`+
          field('触发概率（multiple_probability）','随机启用备用风格的概率；0 表示不随机切换。',slider('multiple_probability',S.multiple_probability??0,0,100,1,'%'))
        ),
        panel('kwr','关键词反应','命中关键词后，给麦麦追加一段固定反应提示。正则用命名捕获组，reaction 里 <code>[名字]</code> 会被替换为匹配内容。',
          `<div class="lab"><span>关键词规则（keyword_rules）</span></div>
           <div id="kwrs">${(S.keyword_rules||[]).map((r,i)=>kwRow(i,r)).join('')}</div>
           ${smBtn('outline','plus','添加关键词规则','onclick="addKwRow()"')}
           <div class="lab" style="margin-top:14px"><span>正则规则（regex_rules）</span></div>

        ),
        panel('chatp','额外 Prompt','给指定群聊或私聊额外补充聊天要求；有特殊群规或语气要求时再加。平台与目标 ID 精确匹配（平台填适配器名如 qq），同一目标多条自动拼接。',

          field('暴露的工具（chat_tools）','从 AstrBot 已注册的 llm_tool 中选取（插件/MCP/核心），需与注册名一致',chips('chat_tools',S.chat_tools,'如 send_meme'),'',true)+
          field('暴露的技能（chat_skills）','从 AstrBot 技能库选取（SKILL.md），注入后模型可按技能说明执行',chips('chat_skills',S.chat_skills,'技能名'),'',true)+
          `<div class="fdesc" style="margin-top:8px">管家 <code>call_maid</code>：<span id="ct_maid_state">${maidStateHTML()}</span>，随管家桥开关自动加入/移出聊天工具集。等价关系：MaiBot send_emoji ↔ stealer 的 send_meme；记忆查询类暂无等价物。</div>`
        ),
      ].join('');
      return `<div class="ui-tabs full" style="grid-template-columns:1fr 1fr">
          <button class="${maisoulTab==='core'?'on':''}" onclick="setMsTab('core')">核心设置</button>
          <button class="${maisoulTab==='detail'?'on':''}" onclick="setMsTab('detail')">详细设置</button>
        </div>${maisoulTab==='core'?core:detail}`;
    },
    personamgr: ()=>{
      const names = (S.personas||[]).map(p=>str(p.name||'').trim()).filter(Boolean);
      const opt = (sel)=>['',...names].map(n=>`<option value="${esc(n)}" ${sel===n?'selected':''}>${n||'主配置（兜底）'}</option>`).join('');

          `<div id="gps">${(S.group_persona||[]).map((g,i)=>gpRow(i,g,names)).join('')}</div>

let curPage='overview';
let L = null;      // 学习库数据 {key: {expressions:[], jargons:[]}}
let LKey = 'global';
async function loadLearning(){
  try{
    L=await apiGet('learning');
    if(!L||typeof L!=='object')L={};
    if(!L[LKey])LKey='global';
    if(curPage==='learn')render('learn');
  }catch(e){L={};if(curPage==='learn')render('learn')}
}
async function saveLearningLib(){
  try{
    collectLibEdits();
    await apiPost('learning',L);
    toast('✓ 学习库已保存');render('learn');
  }catch(e){toast('保存学习库失败：'+e.message)}
}
function collectLibEdits(){
  if(!L||!L[LKey])return;
  const t=document.getElementById('lib_expr');
  if(t)L[LKey].expressions=[...t.querySelectorAll('tr')].slice(1).filter(r=>r.querySelector('.le-sit')).map(r=>({
    situation:r.querySelector('.le-sit').value.trim(),
    style:r.querySelector('.le-sty').value.trim(),
    count:parseInt(r.querySelector('.le-count')?.textContent)||1,
    checked:r.querySelector('.le-ck').checked
  })).filter(e=>e.situation&&e.style);
  const j=document.getElementById('lib_jargon');
  if(j)L[LKey].jargons=[...j.querySelectorAll('tr')].slice(1).filter(r=>r.querySelector('.lj-con')).map(r=>({
    content:r.querySelector('.lj-con').value.trim(),
    meaning:r.querySelector('.lj-mea').value.trim(),
    count:1
  })).filter(x=>x.content&&x.meaning);
}
function ensureLibBucket(){if(!L)L={};if(!L[LKey])L[LKey]={expressions:[],jargons:[]};return L[LKey]}
function addExprLib(){ensureLibBucket().expressions.push({situation:'',style:'',count:1,checked:true});render('learn');setTimeout(()=>{const rows=document.querySelectorAll('#lib_expr tr');const last=rows[rows.length-1];if(last&&last.querySelector('.le-sit'))last.querySelector('.le-sit').focus()},0)}
function addJargonLib(){ensureLibBucket().jargons.push({content:'',meaning:'',count:1});render('learn');setTimeout(()=>{const rows=document.querySelectorAll('#lib_jargon tr');const last=rows[rows.length-1];if(last&&last.querySelector('.lj-con'))last.querySelector('.lj-con').focus()},0)}
function delLib(kind,i){collectLibEdits();ensureLibBucket()[kind].splice(i,1);render('learn')}

function openPersona(idx){
  if(idx==='main'){
    pe = {idx:'main', data:{name:'主配置', bot_name:str(S.bot_name||''), aliases:[...(S.aliases||[])],
      personality:str(S.personality||''), behavior_style:str(S.behavior_style||''),
      reply_style:str(S.reply_style||''), group_chat_prompt:str(S.group_chat_prompt||'')}};

function closePersona(){ pe=null; showPeModal(false); }
function commitPersona(){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
  if(pe.idx==='main'){
    if(g('pe_botname')) S.bot_name=g('pe_botname');
    S.aliases=S.pe_nick||[];
    S.personality=g('pe_personality');
    S.behavior_style=g('pe_behavior');
    S.reply_style=g('pe_reply');
    S.group_chat_prompt=g('pe_gcp');
    pe=null; showPeModal(false); render('personamgr'); return;
  }
  pe.data.name=g('pe_name');
  pe.data.bot_name=g('pe_botname');
  pe.data.aliases=S.pe_nick||[];
  pe.data.personality=g('pe_personality');
  pe.data.behavior_style=g('pe_behavior');
  pe.data.reply_style=g('pe_reply');
  pe.data.group_chat_prompt=g('pe_gcp');
  if(!pe.data.name){toast('人格名不能为空');return}
  if(pe.idx==null)S.personas.push(pe.data); else S.personas[pe.idx]=pe.data;
  pe=null; showPeModal(false); render('personamgr');
}

/* ---------------- 暴露工具/技能弹窗：列表读 AstrBot 原生注册表（/astrbot_plugin_maisoul/tools） ---------------- */
let tpRegistry=null, tpTab='tools';
function jsq(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function openToolPicker(){
  if(!tpRegistry){
    try{const d=await apiGet('tools');tpRegistry={tools:d.tools||[],skills:d.skills||[]}}
    catch(e){toast('读取 AstrBot 工具/技能失败：'+e.message);return}
  }
  tpTab='tools';renderToolPicker();
}
function closeToolPicker(){const h=document.getElementById('tp_modal_host');if(h)h.innerHTML=''}
function renderToolPicker(){
  let host=document.getElementById('tp_modal_host');
  if(!host){host=document.createElement('div');host.id='tp_modal_host';document.body.appendChild(host)}
  const isTool=tpTab==='tools';
  const list=isTool?tpRegistry.tools:tpRegistry.skills;
  const selKey=isTool?'chat_tools':'chat_skills';
  const sel=new Set(S[selKey]||[]);
  const maidOn=isTool&&S.maid_bridge!==false&&!sel.has('call_maid');  // 管家由开关默认加入，不在 chat_tools 数组里
  const rows=list.length?list.map(it=>{
    const viaBridge=isTool&&it.name==='call_maid'&&maidOn;
    const on=sel.has(it.name)||viaBridge;
    const badge=isTool
      ?`<span class="ui-badge ${it.origin==='builtin'?'default':it.origin==='plugin'?'secondary':'soft'}">${esc(it.origin==='builtin'?'AstrBot 核心':it.origin==='plugin'?'插件 · '+it.origin_name:it.origin==='mcp'?'MCP · '+it.origin_name:'未注册来源')}</span>${viaBridge?'<span class="ui-badge secondary">管家桥 · 默认</span>':''}`
      :`<span class="ui-badge ${it.source_type==='plugin'?'secondary':'soft'}">${esc(it.source_type==='plugin'?'插件 · '+(it.plugin_name||''):it.source_type==='sandbox_only'?'沙盒':'本地')}${it.active?'':' · 已停用'}</span>`;
    return `<div class="tp-item ${on?'on':''}" onclick="toggleExpose('${selKey}','${jsq(it.name)}')">
      <span class="tp-check">${on?moIcon('circle-check',12):''}</span>
      <div class="tp-info"><b>${esc(it.name)}</b>${badge}<small>${esc(str(it.description||'').slice(0,90))||'（无描述）'}</small></div>
    </div>`}).join('')
    :`<div class="tp-empty">AstrBot 中暂未${isTool?'注册任何 llm_tool':'安装任何技能'}</div>`;
  host.innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeToolPicker()">
    <div class="modal">
      <div class="modal-head">
        <div><b>暴露工具与技能</b>
          <div class="desc">列表实时读取 AstrBot 原生注册表：TOOLS = llm_tool 管理器（插件/MCP/核心工具），SKILL = 技能库（SKILL.md）。勾选即加入暴露列表；管家 call_maid 由「管家桥」开关默认加入，在此勾选/取消即切换该开关。</div></div>
        <button class="modal-x" onclick="closeToolPicker()" title="关闭">${moIcon('x',16)}</button>
      </div>
      <div class="modal-body">
        <div class="ui-tabs" style="margin-bottom:12px">
          <button class="${isTool?'on':''}" onclick="tpTab='tools';renderToolPicker()">${moIcon('wrench',14)} TOOLS <span class="fcnt">${tpRegistry.tools.length}</span></button>
          <button class="${!isTool?'on':''}" onclick="tpTab='skills';renderToolPicker()">${moIcon('book-open',14)} SKILL <span class="fcnt">${tpRegistry.skills.length}</span></button>
        </div>
        <div class="tp-list">${rows}</div>
      </div>
      <div class="modal-foot" style="justify-content:space-between;align-items:center">
        <small class="tp-foot">已选 工具 ${(S.chat_tools||[]).length+(maidOn?1:0)} · 技能 ${(S.chat_skills||[]).length}，应用后仍需「保存全部配置」</small>
        <div style="display:flex;gap:8px">
          <button class="ui-btn outline" onclick="closeToolPicker()">取消</button>
          <button class="ui-btn default" onclick="applyToolPicker()">应用</button>
        </div>
      </div>
    </div></div>`;
}
function toggleExpose(key,name){
  const arr=S[key]||[];
  if(name==='call_maid'&&!arr.includes(name)){
    S.maid_bridge=S.maid_bridge===false;  // 不在 chat_tools 里 → 勾/取消就是切管家桥开关
    renderToolPicker();return;
  }
  S[key]=arr.includes(name)?arr.filter(n=>n!==name):[...arr,name];
  renderToolPicker();
}
function maidStateHTML(){return S.maid_bridge!==false?'<b style="color:hsl(var(--primary))">已默认暴露</b>（「管家桥」开关开）':'未暴露（「管家桥」开关关）'}
function applyToolPicker(){
  refreshChips('chat_tools');refreshChips('chat_skills');
  const st=document.getElementById('ct_maid_state');if(st)st.innerHTML=maidStateHTML();
  closeToolPicker();toast('✓ 已更新暴露列表，记得保存配置')
}

function moIcon(name,size){
  const arr=MO_ICONS[name]||[];
  let inner='';
  for(let i=0;i<arr.length;i++){
    const sh=arr[i];let at='';
    for(const k in sh[1]){at+=' '+k+'="'+sh[1][k]+'"'}
    inner+='<'+sh[0]+at+'/>';
  }
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:'+size+'px;height:'+size+'px" aria-hidden="true">'+inner+'</svg>';
}
let MO={events:[],sessions:{},stages:{},sel:null,connTxt:'',sseId:null,pollTimer:null,started:false,lastEventId:0,renderTimer:null,expanded:{},gotOpen:false,autoScroll:true,reasoning:null,
        collapsed:(function(){try{return localStorage.getItem('maisaka-monitor-sidebar-collapsed')!=='false'}catch(e){return false}})()};
/* ---- 工具函数：照抄部署 chunk（Pe/fe/P/zt/Dt/Le/Ot） ---- */
function moFmtMs(ms){ms=ms||0;return ms<1000?Math.round(ms)+'ms':(ms/1000).toFixed(2)+'s'}
function moFmtTs(ts){const d=new Date((ts||0)*1000);const z=n=>String(n).padStart(2,'0');return z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds())}
function moRelTime(ts){const diff=Date.now()/1000-(ts||0);if(diff<10)return '刚刚';if(diff<60)return Math.round(diff)+'秒前';if(diff<3600)return Math.round(diff/60)+'分钟前';return Math.round(diff/3600)+'小时前'}
function moAgentLabel(s){const v=String(s==null?'':s).trim();const lv=v.toLowerCase();if(!lv||lv==='stop')return null;if(lv==='running')return '运行中';if(lv==='wait')return '等待中';return v}
function moIsWaiting(st){return st&&(st.stage==='等待消息'||String(st.detail||'').indexOf('等待消息')>=0||st.agent_state==='wait')}
function moInitial(name,fallback){const v=String(name==null?'':name).trim();return v?v.slice(0,1):fallback}
/* ---- 事件入口 ---- */
function moTouchSession(sid,ts){
  const s=MO.sessions[sid];
  if(s){s.last=ts||s.last||Date.now()/1000}
}
function moIngest(ev){
  if(!ev||!ev.event)return;
  const d=ev.data||{};
  const sid=d.session_id,ts=d.timestamp||Date.now()/1000;
  if(ev.event==='stream.open'){MO.gotOpen=true;MO.connTxt='已连接';moRenderConn();return}
  if(ev.event==='stage.status'){MO.stages[sid]=d;moTouchSession(sid,ts);moSchedule();return}
  if(ev.event==='stage.removed'){delete MO.stages[sid];moTouchSession(sid,ts);moSchedule();return}
  if(ev.event==='session.start'){
    MO.sessions[sid]={name:d.session_name,platform:d.platform,is_group:d.is_group_chat,count:0,last:ts};
    if(MO.sel===null)MO.sel=sid;  // 部署版：首个出现的会话自动选中
    moSchedule();return;
  }
  if(!MO.sessions[sid])MO.sessions[sid]={name:sid,platform:'',is_group:false,count:0,last:ts};
  const s=MO.sessions[sid];
  /* 按 event_id 去重（SSE 与轮询双通道可能重复投递同一事件） */
  if(d.event_id){
    MO.seenIds=MO.seenIds||new Set();
    if(MO.seenIds.has(d.event_id))return;
    MO.seenIds.add(d.event_id);
  }
  s.count=(s.count||0)+1;s.last=ts;
  MO.events.push({id:d.event_id||('t'+Date.now()+Math.random()),type:ev.event,data:d,ts:ts,sid:sid});
  if(MO.events.length>2000)MO.events=MO.events.slice(-1500);
  if(d.event_id)MO.lastEventId=Math.max(MO.lastEventId,d.event_id);
  moSchedule();
}
function moSchedule(){
  if(MO.renderTimer)return;
  MO.renderTimer=setTimeout(()=>{MO.renderTimer=null;moRenderAll()},150);
}
/* ---- 页面骨架（部署版主布局：aside 聊天流 + 主列 阶段条+时间线 Card） ---- */
function moAsideHeadHTML(){
  const conn=MO.gotOpen||MO.pollTimer;
  return `<h2 class="mo-aside-title">
    <span class="mo-ticon">${moIcon('activity',16)}</span>聊天流
    ${conn?`<span class="mo-conn" title="${esc(MO.connTxt||'已连接')}"></span>`:''}
    <button class="mo-gbtn icon" onclick="MO.collapsed=!MO.collapsed;try{localStorage.setItem('maisaka-monitor-sidebar-collapsed',String(MO.collapsed))}catch(e){};moRefreshAside()" title="${MO.collapsed?'展开侧边栏':'折叠侧边栏'}">${moIcon(MO.collapsed?'chevron-right':'chevron-left',14)}</button>
  </h2>`;
}
function observeHTML(){
  return `<div class="mo-root">
    <aside class="mo-aside ${MO.collapsed?'collapsed':''}" id="mo_aside">
      <div class="mo-aside-head">${moAsideHeadHTML()}</div>
      <div class="mo-sep"></div>
      <div class="mo-sessions" id="mo_sessions"></div>
    </aside>
    <div class="mo-main">
      <div id="mo_stagebar"></div>
      <div class="mo-tlcard"><div class="mo-tl" id="mo_tl" onscroll="moOnScroll(this)"><div class="mo-tlin" id="mo_tlin"></div></div></div>
    </div>
  </div>`
}
function moRefreshAside(){
  const a=document.getElementById('mo_aside');if(!a)return;
  a.classList.toggle('collapsed',MO.collapsed);
  const h=a.querySelector('.mo-aside-head');if(h)h.innerHTML=moAsideHeadHTML();
  moRenderSide();
}
function moRenderConn(){
  const a=document.getElementById('mo_aside');
  if(!a)return;
  const h=a.querySelector('.mo-aside-head');
  if(h&&((MO.gotOpen||MO.pollTimer)!==MO._connDrawn)){h.innerHTML=moAsideHeadHTML();MO._connDrawn=(MO.gotOpen||MO.pollTimer)}
}
/* ---- 会话侧栏（部署版 SessionSidebar：rounded-md 头像+状态点+事件数+相对时间+当前阶段） ---- */
function moRenderSide(){
  const host=document.getElementById('mo_sessions');if(!host)return;
  const ids=Object.keys(MO.sessions).sort((a,b)=>(MO.sessions[b].last||0)-(MO.sessions[a].last||0));
  if(!ids.length){host.innerHTML=`<div class="mo-sess-empty"><span style="opacity:.4;display:flex">${moIcon('bot',32)}</span><p>等待 MaiSaka 会话…</p></div>`;return}
  host.innerHTML=ids.map(sid=>{
    const s=MO.sessions[sid],st=MO.stages[sid];
    const dot=st?`<span class="mo-sdot ${moIsWaiting(st)?'wait':''}"></span>`:'';
    return `<button class="mo-sess ${MO.sel===sid?'on':''}" onclick="moSel('${jsq(sid)}')" title="${esc(s.name||sid)}">
      <div class="r1"><div class="lft">
        <span class="mo-sava"><span class="img">${esc(moInitial(s.name,s.is_group?'群':'私'))}</span>${dot}</span>
        <span class="mo-sname">${esc(s.name||sid)}</span>
      </div><span class="mo-badge secondary h16">${s.count||0}</span></div>
      <div class="r2"><span class="tm">${moRelTime(s.last)}</span>${st?`<span class="stg">${esc(st.stage||'')}</span>`:''}</div>
    </button>`}).join('');
}
function moSel(sid){MO.sel=sid;moRenderAll()}
/* ---- 统计（部署版 reducer：ingested+sent→消息；finalized→循环+工具数；只统计当前选中会话） ---- */
function moCurEvents(){return MO.sel===null?MO.events:MO.events.filter(e=>e.sid===MO.sel)}
function moStats(){
  let messages=0,cycles=0,toolCalls=0;
  moCurEvents().forEach(e=>{
    if(e.type==='message.ingested'||e.type==='message.sent')messages++;
    else if(e.type==='planner.finalized'){cycles++;toolCalls+=(e.data.tools||[]).length}
  });
  return {messages,cycles,toolCalls};
}
/* ---- 阶段状态条（部署版 StageStatusPanel：统计chip+回到底部/清空 居中，阶段徽章组，更新于 ml-auto） ---- */
function moRenderStagebar(){
  const host=document.getElementById('mo_stagebar');if(!host)return;
  const st=MO.sel!==null?MO.stages[MO.sel]:null;
  const s=moStats();
  const bar=`<div class="mo-stats" title="消息：${s.messages}&#10;循环：${s.cycles}&#10;工具调用：${s.toolCalls}">${moIcon('activity',12)}<span class="lbl">统计</span></div>
    <div class="mo-act">
      <button class="mo-gbtn" onclick="moToBottom()" title="回到底部"><span class="chev ${MO.autoScroll?'on':''}" style="display:flex;margin-right:4px">${moIcon('chevron-down',12)}</span>回到底部</button>
      <button class="mo-gbtn icon" onclick="moClear()" title="清空" aria-label="清空">${moIcon('eraser',12)}</button>
    </div>`;
  if(!st){
    host.innerHTML=`<div class="mo-stagebar empty">${bar}<span class="mo-emptytxt">当前聊天流暂无阶段状态</span></div>`;
    return;
  }
  const ag=moAgentLabel(st.agent_state);
  host.innerHTML=`<div class="mo-stagebar">
    ${bar}
    <div class="mo-stagegrp">
      <span class="mo-badge default g05 p6 t10">${moIcon('activity',10)}${esc(st.stage||'未知阶段')}</span>
      ${st.round_text?`<span class="mo-badge secondary p6 t10">${esc(st.round_text)}</span>`:''}
      ${ag?`<span class="mo-badge ${String(st.agent_state||'').toLowerCase()==='running'?'default':'outline'} p6 t10">${esc(ag)}</span>`:''}
      <span class="mo-upd">更新于 ${moRelTime(st.updated_at||st.timestamp)}</span>
    </div>
    ${st.detail?`<p class="mo-sdetail">${esc(st.detail)}</p>`:''}
  </div>`;
}
/* ---- 折叠文本（部署版 CollapsibleText：超 N 行折叠为空格拼接，chevron 图标，文字色 primary） ---- */
function moCollapsible(text,maxLines,key,cls){
  if(!text)return '';
  const t=String(text);
  const lines=t.split('\n');
  if(lines.length<=maxLines)return `<p class="mo-cpt ${cls||''}">${esc(t)}</p>`;

function moArgChips(args){
  const entries=Object.entries(args||{});

  return entries.map(([k,v])=>{
    const raw=typeof v==='string'?v:(v===undefined?'undefined':JSON.stringify(v,null,2));
    const tp=Array.isArray(v)?'array('+v.length+')':(v===null?'null':typeof v);

    return `<span class="mo-arg" title="${esc(k+' ('+tp+'): '+raw)}"><b>${esc(k)}</b><span class="eq">=</span><i>${esc(inline)}</i></span>`;
  }).join('');

/* ---- 数据通道：轮询保底常开；SSE 可用（真正收到帧）才接管停轮询 ---- */
function moStopPoll(){
  if(MO.pollTimer){clearInterval(MO.pollTimer);MO.pollTimer=null}
}
async function startMonitor(){
  if(MO.started){moRenderAll();return}
  MO.started=true;
  try{
    const r=await apiGet('monitor/replay',{since:0,limit:300});
    const arr=(r&&r.data)||r||[];
    arr.forEach(x=>moIngest(x));
    MO.connTxt=`已载入 ${arr.length} 条历史`;
  }catch(e){MO.connTxt='历史载入失败：'+e.message}
  moRenderAll();
  moStartPoll();  // 保底通道先跑起来——SSE 被扩展层缓冲/悬死时页面依然实时
  const b=getBridge();
  if(b&&b.subscribeSSE){
    try{
      MO.sseId=await b.subscribeSSE('monitor/stream',
        {onmessage:m=>{
           try{
             moIngest(JSON.parse(m));
             /* 收到真实帧 = SSE 通道活着 → 停轮询 */
             if(MO.gotOpen&&MO.pollTimer){moStopPoll();MO.connTxt='已连接';moRenderConn()}
           }catch(err){}
         },
         onstate:s=>{if(s!=='open'&&!MO.gotOpen)moStartPoll()}},{});
      MO.connTxt='实时连接…';
      // 看门狗：8s 内没有任何帧（含 stream.open）→ 退回并保持轮询
      setTimeout(()=>{
        if(!MO.gotOpen&&MO.sseId){
          try{if(b.unsubscribeSSE)asyncBridgeUnsub(b)}catch(e){}
          MO.sseId=null;
        }
      },8000);
      moRenderConn();
    }catch(e){MO.sseId=null;moRenderConn()}
  }
}
async function asyncBridgeUnsub(b){
  try{if(MO.sseId&&b.unsubscribeSSE)await b.unsubscribeSSE(MO.sseId)}catch(e){}
  MO.connTxt='轮询模式（2.5s）';moRenderConn();
}
function moStartPoll(){
  if(MO.pollTimer)return;
  if(!MO.gotOpen)MO.connTxt='轮询中（2.5s）';
  moRenderConn();
  MO.pollTimer=setInterval(async()=>{
    try{
      const r=await apiGet('monitor/replay',{since:MO.lastEventId,limit:200});
      const arr=(r&&r.data)||r||[];
      if(arr.length)arr.forEach(x=>moIngest(x));
    }catch(e){}
  },2500);
}

async function initModelsPage(){
  S.task_models=mdNormalize(S.task_models);
  MM={providers:[],sel:'all',tab:'cfg',search:'',selTask:'planner',msOpen:false,msQuery:'',saveTimer:null,saveTxt:''};

    const r=await apiGet('models/list');
    MM.providers=(r&&r.providers)||[];

}
function mdSwitchTab(t){MM.tab=t;MM.msOpen=false;mdRender()}
function mdSelProv(p){MM.sel=p;MM.msOpen=false;mdRender()}
function mdSelTask(k){MM.selTask=k;MM.msOpen=false;mdRender()}
function mdUsedSet(){const s=new Set();MD_TASKS.forEach(t=>mdTaskCfg(t.key).models.forEach(m=>s.add(m.provider+'::'+m.model)));return s}
function mdRender(){
  const a=document.getElementById('md_tab_cfg'),b=document.getElementById('md_tab_tasks');
  if(a)a.classList.toggle('on',MM.tab==='cfg');
  if(b)b.classList.toggle('on',MM.tab==='tasks');
  const host=document.getElementById('md_body');
  if(host)host.innerHTML=MM.tab==='cfg'?mdCfgHTML():mdTasksHTML();
}

/* Tab1：厂商+模型 只读浏览 */
function mdCfgHTML(){

  const selProv=MM.sel==='all'?null:provs.find(p=>p.id===MM.sel);

  const rows=[];

    rows.push(`<tr><td class="md-dotcell"><span class="md-dot ${on?'on':''}" title="${on?'已使用':'未使用'}"></span></td><td>${esc(m)}</td><td>${esc(p.id)}${p.enable?'':' <span class="ui-badge secondary">未启用</span>'}</td></tr>`);
  }));

    <aside class="md-aside">
      <div class="md-ahead"><h2>模型厂商</h2></div>

        ${provs.map(p=>`<button class="md-item ${MM.sel===p.id?'on':''} ${p.enable?'':'off'}" onclick="mdSelProv('${jsq(p.id)}')" title="${esc(p.type)}"><span class="l2"><span class="lbl">${esc(p.id)}</span></span><span class="cnt">${p.models.length}</span></button>`).join('')}

    </aside>
    <section class="md-main">

        <p class="md-found" id="md_found"></p>
      </div>
      ${selProv?`<div class="md-provbar"><div><h3>${esc(selProv.id)}</h3><p>类型：${esc(selProv.type)||'—'} · 默认模型：${esc(selProv.default_model)||'—'} · ${selProv.models.length} 个模型${selProv.enable?'':' · 未启用'}</p></div></div>`:''}
      <table class="ui-tbl"><thead><tr><th class="md-dotcell">使用</th><th>模型名称</th><th>提供商</th></tr></thead><tbody id="md_rows">${rows.length?rows.join(''):`<tr><td colspan="3" class="empty-cell">${MM.search?'未找到匹配的模型':'暂无模型配置'}</td></tr>`}</tbody></table>
    </section>
  </div>`;
}
function mdRefreshRows(){
  /* 搜索只刷新表格与计数，不重建输入框（保焦点） */
  const host=document.getElementById('md_body');if(!host||MM.tab!=='cfg')return;
  const tmp=document.createElement('div');
  /* 复用 mdCfgHTML 的行渲染：直接重渲染表格区域 */
  const provs=MM.providers;
  const selProv=MM.sel==='all'?null:provs.find(p=>p.id===MM.sel);
  const shown=selProv?[selProv]:provs;
  const q=(MM.search||'').toLowerCase(),used=mdUsedSet();
  const rows=[];
  shown.forEach(p=>p.models.forEach(m=>{
    if(q&&!(String(m).toLowerCase().includes(q)||String(p.id).toLowerCase().includes(q)))return;
    const on=used.has(p.id+'::'+m);
    rows.push(`<tr><td class="md-dotcell"><span class="md-dot ${on?'on':''}" title="${on?'已使用':'未使用'}"></span></td><td>${esc(m)}</td><td>${esc(p.id)}${p.enable?'':' <span class="ui-badge secondary">未启用</span>'}</td></tr>`);
  }));
  const tb=document.getElementById('md_rows');
  if(tb)tb.innerHTML=rows.length?rows.join(''):`<tr><td colspan="3" class="empty-cell">${MM.search?'未找到匹配的模型':'暂无模型配置'}</td></tr>`;
  const fd=document.getElementById('md_found');
  if(fd)fd.textContent=MM.search?`找到 ${rows.length} 个结果`:'';
}
/* Tab2：任务分配 */
function mdOptions(){const out=[];MM.providers.forEach(p=>p.models.forEach(m=>out.push({provider:p.id,model:m})));return out}
function mdMSListHTML(selected){
  const q=(MM.msQuery||'').toLowerCase();
  const filtered=mdOptions().filter(o=>!q||(o.model+' '+o.provider).toLowerCase().includes(q));
  if(!filtered.length)return `<div class="md-ms-empty">暂无可用模型</div>`;
  return filtered.map(o=>{
    const on=selected.some(s=>s.provider===o.provider&&s.model===o.model);
    return `<div class="md-ms-item" onclick="event.stopPropagation();mdToggleModel('${jsq(o.provider)}','${jsq(o.model)}')"><span class="md-check">${on?moIcon('circle-check',13):''}</span><span>${esc(o.provider)} · ${esc(o.model)}</span></div>`;
  }).join('');
}
function mdMultiSelectHTML(selected){
  return `<div class="md-ms" id="md_ms">
    <button type="button" class="md-ms-trig" onclick="event.stopPropagation();MM.msOpen=!MM.msOpen;mdRender()">
      <span class="md-ms-badges">${selected.length?selected.map(m=>`<span class="ui-badge secondary md-tag"><span>${esc(m.provider)} · ${esc(m.model)}</span><i title="移除" onclick="event.stopPropagation();mdToggleModel('${jsq(m.provider)}','${jsq(m.model)}')">${moIcon('x',10)}</i></span>`).join(''):'<span class="md-ms-ph">选择模型...</span>'}</span>
      ${moIcon('chevrons-up-down',14)}
    </button>
    ${MM.msOpen?`<div class="md-ms-pop" onclick="event.stopPropagation()">
      <div class="md-ms-search">${moIcon('search',13)}<input placeholder="搜索..." value="${esc(MM.msQuery||'')}" oninput="MM.msQuery=this.value;document.getElementById('md_ms_list').innerHTML=mdMSListHTML(mdTaskCfg(MM.selTask).models)"></div>
      <div class="md-ms-list" id="md_ms_list">${mdMSListHTML(selected)}</div>
    </div>`:''}
  </div>`;
}
function mdTasksHTML(){
  const meta=MD_TASKS.find(t=>t.key===MM.selTask)||MD_TASKS[0];
  const cur=mdTaskCfg(meta.key);
  const st=MD_STRATEGIES.find(s=>s.v===cur.strategy)||MD_STRATEGIES[0];
  return `<div class="md-grid">
    <aside class="md-aside">
      <div class="md-ahead"><h2>模型类别</h2></div>
      <div class="md-alist">
        ${MD_TASKS.map(t=>{const c=mdTaskCfg(t.key);return `<button class="md-item ${MM.selTask===t.key?'on':''}" onclick="mdSelTask('${t.key}')"><span class="l2"><span class="lbl">${t.short}</span><small class="sub">${c.models.length?c.models.map(m=>esc(m.model)).join('、'):'未配置模型'}</small></span><span class="cnt ${c.models.length?'ok':''}">${c.models.length?'已配置 · '+c.models.length:'未配置'}</span></button>`}).join('')}
      </div>
    </aside>
    <section class="md-main">
      <div class="md-thead"><h3>${meta.title}</h3><p>${meta.desc}</p>
        <div class="md-caps">${(meta.caps||[]).map(c=>`<div class="md-cap"><span class="md-cap-t ${c.t==='必须'?'must':(c.t==='按需'?'opt':'')}" style="border:1px solid hsl(var(--border));border-radius:6px;padding:1px 6px;font-size:11px;flex:none;${c.t==='必须'?'color:hsl(var(--destructive))':''}">${c.t}</span><span style="flex:1">${c.d}</span></div>`).join('')}</div>
      </div>
      <div class="md-fld"><label>模型列表</label>${mdMultiSelectHTML(cur.models)}</div>
      <div class="md-fld"><label>模型选择策略</label>
        <select class="md-sel" onchange="mdSetStrategy(this.value)">
          ${MD_STRATEGIES.map(s=>`<option value="${s.v}" ${cur.strategy===s.v?'selected':''}>${s.label}</option>`).join('')}
        </select>
        <p class="md-hint">${st.tip}</p>
      </div>
      <p class="md-note">温度 / 最大 Token 等参数跟随所选 Provider 在 AstrBot 模型设置中的配置（text_chat 不支持按次覆盖）；同理，思考开关也无法按次关闭——需要非思考行为时请直接选择非思考的模型条目。规划模型建议绑「支持工具调用 + 思考」的条目，回复模型建议绑「快 + 非思考」的条目，两类任务可在 AstrBot「模型提供商」中分属不同条目。</p>
      <div class="md-savest"><span id="md_savetxt">${MM.saveTxt||''}</span></div>
    </section>
  </div>`;
}
function mdToggleModel(p,m){
  const entry=mdTaskEntry(MM.selTask),list=entry.models;
  const idx=list.findIndex(x=>x.provider===p&&x.model===m);
  if(idx>=0)list.splice(idx,1);else list.push({provider:p,model:m});
  mdScheduleSave();mdRender();
}
function mdSetStrategy(v){
  mdTaskEntry(MM.selTask).strategy=v;
  mdScheduleSave();mdRender();
}
function mdNormalize(v){
  const out=[];const known={};
  if(Array.isArray(v))v.forEach(e=>{if(e&&e.task)known[e.task]=e});
  else if(v&&typeof v==='object')Object.keys(v).forEach(k=>{known[k]=Object.assign({task:k},v[k])});
  MD_TASKS.forEach(t=>{
    const e=known[t.key]||{};
    out.push({task:t.key,
      models:Array.isArray(e.models)?e.models.filter(m=>m&&m.provider&&m.model):[],
      strategy:MD_STRATEGIES.some(s=>s.v===e.strategy)?e.strategy:'sequential'});
  });
  return out;
}
function mdScheduleSave(){
  MM.saveTxt='配置将在 2 秒后自动保存';mdSaveTxt();
  if(MM.saveTimer)clearTimeout(MM.saveTimer);
  MM.saveTimer=setTimeout(mdDoSave,2000);
}
function mdSaveTxt(){const el=document.getElementById('md_savetxt');if(el)el.textContent=MM.saveTxt||''}
async function mdDoSave(){
  MM.saveTxt='保存中…';mdSaveTxt();
  try{
    await apiPost('config',{task_models:S.task_models});
    MM.saveTxt='已保存';
  }catch(e){MM.saveTxt='保存失败：'+e.message}
  mdSaveTxt();
}

/* ---------------- 模式 ---------------- */
function setMode(m){S.mode=m;document.querySelectorAll('.mode').forEach((el,i)=>el.classList.toggle('on',(i===0)===(m==='independent')))}

/* ---------------- 收集 & 保存 ---------------- */
function collect(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:null};
  const num=(id,dft)=>{const v=parseFloat(g(id));return isNaN(v)?dft:v};
  const bool=(id,dft)=>{const el=document.getElementById(id);return el?(el.type==='checkbox'?el.checked:dft):dft};
  if(g('bot_name')!==null)S.bot_name=g('bot_name')||'麦麦';
  ['personality','reply_style','behavior_style','group_chat_prompt','private_chat_prompts'].forEach(k=>{if(g(k)!==null)S[k]=g(k)});
  if(g('max_context_size')!==null)S.max_context_size=Math.max(5,parseInt(g('max_context_size'))||40);
  if(g('reply_trigger_mode')!==null)S.reply_trigger_mode=g('reply_trigger_mode');
  ['multiple_probability','typo_min_freq','splitter_max_length','splitter_max_sentence_num','splitter_max_split_num','max_private_context_size','max_consecutive_wait_count','planner_interrupt_max_consecutive_count','no_action_backoff_start_count','no_action_backoff_bypass_pending_count'].forEach(k=>{if(g(k)!==null)S[k]=num(k,S[k])});
  ['talk_value','private_talk_value','typing_speed','typo_correction_quote_probability','typo_error_rate','typo_tone_error_rate','typo_word_replace_rate','no_action_backoff_base_seconds','no_action_backoff_cap_seconds'].forEach(k=>{if(g(k)!==null)S[k]=num(k,S[k])});
  ['enable','enable_response_post_process','typo_enable','typo_enable_correction_quote','splitter_enable','splitter_enable_kaomoji_protection','splitter_enable_overflow_return_all','inevitable_at_reply','mentioned_bot_reply','enable_talk_value_rules','enable_reply_quote'].forEach(k=>{S[k]=bool(k,S[k]??true)});
  const mb=document.getElementById('maid_bridge');if(mb)S.maid_bridge=mb.checked;
  const eaw=document.getElementById('escape_at_wake');if(eaw)S.escape_at_wake=eaw.checked;
  const ei=document.getElementById('eco_injection');if(ei)S.eco_injection=ei.checked;
  const styles=[...document.querySelectorAll('[data-style]')].map(t=>t.value.trim()).filter(Boolean);
  if(styles.length||document.getElementById('mrs'))S.multiple_reply_style=styles;
  const cps=[...document.querySelectorAll('[data-cp]')].map(r=>({platform:r.querySelector('.cp-platform').value.trim(),item_id:r.querySelector('.cp-chat').value.trim(),rule_type:'group',prompt:r.querySelector('.cp-prompt').value.trim()})).filter(c=>c.platform&&c.item_id&&c.prompt);
  if(cps.length||document.getElementById('cps'))S.chat_prompts=cps;
  const tvrs=[...document.querySelectorAll('[data-tvr]')].map(r=>({platform:r.querySelector('.tvr-platform').value.trim(),item_id:r.querySelector('.tvr-item').value.trim(),rule_type:'group',time:r.querySelector('.tvr-time').value.trim(),value:parseFloat(r.querySelector('.tvr-value').value)||0}));
  if(tvrs.length||document.getElementById('tvrs'))S.talk_value_rules=tvrs;
  const gps=[...document.querySelectorAll('[data-gp]')].map(r=>({chat:r.querySelector('.gp-chat').value.trim(),name:r.querySelector('.gp-name').value}));
  if(gps.length||document.getElementById('gps'))S.group_persona=gps.filter(g=>g.chat&&g.name);
  const lrCollect=host=>host?[...host.querySelectorAll('[data-elr]')].map(r=>({platform:r.querySelector('.elr-platform').value.trim(),item_id:r.querySelector('.elr-item').value.trim(),type:'group',use:r.querySelector('.elr-use').checked,learn:r.querySelector('.elr-learn').checked})):[];
  const elrHost=document.getElementById('elrs');
  if(elrHost)S.expression_learning_list=lrCollect(elrHost);
  const jlHost=document.getElementById('jlrs');
  if(jlHost)S.jargon_learning_list=lrCollect(jlHost);
  const grCollect=host=>host?[...host.querySelectorAll('[data-egr]')].map(r=>({targets:r.querySelector('.egr-targets').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean).map(s=>{const [platform,item_id]=s.split(':').map(x=>x.trim());return {platform:platform||'',item_id:item_id||''}})})).filter(g=>g.targets.length):[];
  const egrHost=document.getElementById('egrs');
  if(egrHost)S.expression_groups=grCollect(egrHost);
  const jgrHost=document.getElementById('jgrs');
  if(jgrHost)S.jargon_groups=grCollect(jgrHost);
  const kwrHost=document.getElementById('kwrs');
  const pdrHost=document.getElementById('pds');
  if(pdrHost)S.preset_dialogues=[...pdrHost.querySelectorAll('[data-pdr]')].map(r=>({user:r.querySelector('.pdr-user').value.trim(),reply:r.querySelector('.pdr-reply').value.trim()})).filter(d=>d.user&&d.reply);
  if(kwrHost)S.keyword_rules=[...kwrHost.querySelectorAll('[data-kwr]')].map(r=>({keywords:r.querySelector('.kwr-keys').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),regex:[],reaction:r.querySelector('.kwr-reaction').value.trim()})).filter(r=>r.reaction&&r.keywords.length);
  const rxrHost=document.getElementById('rxrs');
  if(rxrHost)S.regex_rules=[...rxrHost.querySelectorAll('[data-rxr]')].map(r=>({keywords:[],regex:r.querySelector('.rxr-pattern').value.split('\n').map(s=>s.trim()).filter(Boolean),reaction:r.querySelector('.rxr-reaction').value.trim()})).filter(r=>r.reaction&&r.regex.length);
  const eco=document.getElementById('enable_context_optimization');if(eco)S.enable_context_optimization=eco.checked;
  const dp=document.getElementById('default_persona'); if(dp)S.default_persona=dp.value;
  const fps=document.getElementById('follow_persona_switch'); if(fps)S.follow_persona_switch=fps.checked;
}
async function save(){
  const btn=document.getElementById('saveBtn'),bt=document.getElementById('saveBtn_t');
  if(btn)btn.disabled=true;if(bt)bt.textContent='保存中…';
  try{collect();await apiPost('config',S);toast('已保存，立即生效')}
  catch(e){toast('保存失败：'+e.message)}
  if(btn)btn.disabled=false;if(bt)bt.textContent='保存全部配置';
}
